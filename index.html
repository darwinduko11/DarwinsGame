<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruinfall Roguelike RPG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene-layer">
      <div id="sceneBackground" class="scene-background"></div>
      <div class="scene-vignette"></div>
      <div class="scene-fog scene-fog-1"></div>
      <div class="scene-fog scene-fog-2"></div>
    </div>

    <div class="background"></div>
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <div class="app">
      <header class="topbar panel">
        <div class="brand">
          <h1>Ruinfall</h1>
          <p class="subtitle">A dark fantasy choice-driven roguelike</p>
        </div>
        <div class="save-actions">
          <button id="saveBtn">Save</button>
          <button id="loadBtn">Load</button>
          <button id="newGameBtn" class="primary">New Game</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel stats-panel">
          <h2>Character</h2>
          <div id="status"></div>

          <h3>Relationships</h3>
          <div id="relationships"></div>

          <h3>Quests</h3>
          <div id="quests"></div>
        </aside>

        <section class="panel story-panel">
          <div class="story-meta">
            <span id="location"></span>
            <span id="flags"></span>
          </div>

          <h2 id="eventTitle"></h2>
          <div id="diceBox" class="dice-box hidden">
            <div class="dice-label">Rolling D20...</div>
            <div id="diceResult" class="dice-result">0</div>
          </div>
          <p id="description" class="story-text"></p>

          <div id="choices" class="choices"></div>

          <div class="log-wrap">
            <h3>Journal</h3>
            <div id="log" class="log"></div>
          </div>
        </section>

        <aside class="panel inventory-panel">
          <h2>Inventory</h2>
          <div id="inventory"></div>

          <h3>Gold</h3>
          <div id="gold"></div>

          <h3>Memory</h3>
          <div id="memory"></div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
